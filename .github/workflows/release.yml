name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g: 1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release name (e.g: Release 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Passed through env (not inlined in scripts) so input text can't inject shell code
  TAG: ${{ inputs.tag_name }}
  RELEASE_NAME: ${{ inputs.release_name }}

jobs:
  check:
    name: Check tag is free
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a release with this tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release with tag '$TAG' already exists"
            exit 1
          fi

  linux:
    name: Linux (.deb + .rpm)
    needs: check
    # Oldest supported Ubuntu = oldest glibc = binary runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev libv4l-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Package .deb and .rpm
        run: |
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p dist
          cp target/debian/*.deb       "dist/clockode-${TAG}-x86_64.deb"
          cp target/generate-rpm/*.rpm "dist/clockode-${TAG}-x86_64.rpm"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Rename executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/clockode.exe "dist/clockode-$env:TAG-windows-x86_64.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    needs: check
    runs-on: macos-14 # arm64 runner
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Bundle .app and .dmg
        run: |
          VERSION="${TAG#v}"
          APP="dist/Clockode.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/clockode "$APP/Contents/MacOS/clockode"

          # Generate the .icns from the existing PNG icon
          PNG=resources/icons/hicolor/256x256/apps/icon.png
          ICONSET=clockode.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256; do
            sips -z $s $s "$PNG" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          sips -z 64 64   "$PNG" --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
          sips -z 256 256 "$PNG" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/clockode.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Clockode</string>
            <key>CFBundleDisplayName</key><string>Clockode</string>
            <key>CFBundleIdentifier</key><string>dev.mariinkys.Clockode</string>
            <key>CFBundleExecutable</key><string>clockode</string>
            <key>CFBundleIconFile</key><string>clockode</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>Clockode uses the camera to scan QR codes.</string>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign so the bundle (incl. Info.plist) has a valid signature
          codesign --force --deep --sign - "$APP"

          hdiutil create -volname Clockode -srcfolder "$APP" -ov -format UDZO \
            "dist/clockode-${TAG}-macos-aarch64.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          # --target pins the tag to the exact commit that was built;
          # for a draft, the tag itself is created when you publish it.
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --draft \
            --generate-notes
