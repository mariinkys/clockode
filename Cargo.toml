[package]
name = "clockode"
description = "Simple TOTP client (2FA codes) with KeePass storage"
authors = ["mariinkys <kysdev.owjga@aleeas.com>"]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/mariinkys/clockode"

[features]
default = ["default-camera"]

# marker only feature, some camera backend is enabled
camera = []

# default implementation for non-Flatpak builds
default-camera = ["camera", "dep:nokhwa"]

# linux Flatpak implementation
flatpak-camera = [
    "camera",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:ashpd",
]

[build-dependencies]
winresource = "0.1"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", default-features = true, features = [
    "tokio",
    "image",
    "advanced",
    "svg",
] }
anywho = "0.1.2"
dirs = "7.0.0"
smol = "2.0.2"
keepass = { version = "0.15.3", features = [
    "save_kdbx4",
] } # KeePass DB Management
rqrr = "0.11.0" # QR Detection
totp-rs = { version = "6.0.0", features = [
    "otpauth",
    "qr",
] } # TOTP Generation ...
rfd = "0.17.2" # File System Dialogs
secrecy = "0.10.3" # Provides us with SecretString
uuid = "1.28.0" # Allows us to identify entries
serde = { version = "1.0.229", features = [
    "derive",
] } # Needed for config serializing and deserializing
ron = "0.12.2" # Needed for config serializing and deserializing
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "rayon",
] } # needed for qr detection
open = "5.4.4" # needed for opening the default browser
notify-debouncer-full = "0.7.0"
futures = "0.3.34"
arboard = { version = "3.6.1" } # for x11 clipboard
raw-window-handle = "0.6.2" # also needed for clipboard

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

serde_json = "1.0.154" # needed for aegis import (vault parsing)
aes-gcm = "0.11.1" # aegis vault decryption
scrypt = { version = "0.12.0", default-features = false } # aegis key derivation
base64 = "0.23.1" # aegis vault payload

# camera backend for non-flatpak builds
nokhwa = { version = "0.10.11", optional = true, features = ["input-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "camera"], optional = true }
smithay-clipboard = { version = "0.7.3" } # for wayland clipboard (does not depend on flatpak feature)


#
# PACKAGING
#

[package.metadata.deb]
name = "clockode"
maintainer = "mariinkys <kysdev.owjga@aleeas.com>"
copyright = "mariinkys"
section = "utils"
priority = "optional"
extended-description = "Simple TOTP client (2FA codes) with KeePass storage"
# winit dlopens these at runtime, so $auto can't see them
depends = "$auto, libxkbcommon0, libwayland-client0"
assets = [
    [
        "target/release/clockode",
        "usr/bin/",
        "755",
    ],
    [
        "resources/dev.mariinkys.Clockode.desktop",
        "usr/share/applications/dev.mariinkys.Clockode.desktop",
        "644",
    ],
    [
        "resources/dev.mariinkys.Clockode.metainfo.xml",
        "usr/share/metainfo/dev.mariinkys.Clockode.metainfo.xml",
        "644",
    ],
    [
        "resources/icons/hicolor/256x256/apps/icon.png",
        "usr/share/icons/hicolor/256x256/apps/dev.mariinkys.Clockode.png",
        "644",
    ],
    [
        "resources/icons/hicolor/scalable/apps/icon.svg",
        "usr/share/icons/hicolor/scalable/apps/dev.mariinkys.Clockode.svg",
        "644",
    ],
]

[package.metadata.generate-rpm]
name = "clockode"
summary = "Simple TOTP client (2FA codes) with KeePass storage"
assets = [
    { source = "target/release/clockode", dest = "/usr/bin/clockode", mode = "755" },
    { source = "resources/dev.mariinkys.Clockode.desktop", dest = "/usr/share/applications/dev.mariinkys.Clockode.desktop", mode = "644" },
    { source = "resources/dev.mariinkys.Clockode.metainfo.xml", dest = "/usr/share/metainfo/dev.mariinkys.Clockode.metainfo.xml", mode = "644" },
    { source = "resources/icons/hicolor/256x256/apps/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/dev.mariinkys.Clockode.png", mode = "644" },
    { source = "resources/icons/hicolor/scalable/apps/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dev.mariinkys.Clockode.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libwayland-client = "*"


#
# PROFILES
#

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
